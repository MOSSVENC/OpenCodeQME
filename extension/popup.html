<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCodeQME</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="preview-header">
        <div class="brand-mark" aria-hidden="true">OC</div>
        <div class="header-copy">
          <h1>OpenCodeQME</h1>
          <p id="accountName" data-i18n="accountDetecting">正在自动识别账户...</p>
        </div>
        <button class="icon-button" id="syncBtn" type="button" aria-label="立即同步" data-i18n-aria-label="syncNow">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4l-2.35 2.35Z" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <div class="status-banner" id="statusBanner" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText" data-i18n="waitingSync">等待同步</span>
      </div>

      <section class="preview-card" aria-label="使用预览">
        <div class="preview-stat">
          <span class="preview-label" data-i18n="todayTokens">今日 Token</span>
          <strong class="preview-value" id="todayTokens">0</strong>
          <small class="preview-sub" id="todayRequests" data-i18n="requestsCount" data-i18n-vars-count="0">0 次请求</small>
        </div>
        <div class="preview-stat">
          <span class="preview-label" data-i18n="availableQuota">可用额度</span>
          <strong class="preview-value" id="quotaValue">—</strong>
          <small class="preview-sub" id="quotaSub" data-i18n="currentAccount">当前账户</small>
        </div>
      </section>

      <article class="card">
        <div class="card-heading">
          <h2 data-i18n="quotaStatus">额度状态</h2>
          <span class="chip" id="syncChip" data-i18n="notSynced">未同步</span>
        </div>
        <div class="quota-list" id="quotaList">
          <div class="empty-state" data-i18n="waitingAccountSync">打开 opencode.ai 后自动同步</div>
        </div>
      </article>

      <article class="card">
        <div class="card-heading">
          <h2 data-i18n="recentRecords">最近记录</h2>
          <span class="muted" id="recordCount" data-i18n="recordsCount" data-i18n-vars-count="0">0 条</span>
        </div>
        <div class="record-list" id="recentList">
          <div class="empty-state" data-i18n="noRecords">暂无使用记录</div>
        </div>
      </article>

      <div class="action-row">
        <button class="filled-button full" id="detailBtn" type="button" data-i18n="enterDetailMode">进入详细模式</button>
      </div>
    </div>
    <script src="shared/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
